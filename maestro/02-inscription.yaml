# Inscription par e-mail depuis le compte invité : Profil > Créer mon compte.
# Adresse du simulateur d'Amazon SES (aucun vrai courriel), compte marqué
# « de test » par le serveur parce qu'il vient de l'appli du banc.
# EMAIL et MOT_DE_PASSE viennent de lancer_maestro.sh (-e), jamais d'ici.
appId: com.hortenia.app
name: 02 Inscription par e-mail
env:
  NOM: Maestro Banc
---
- runFlow: sous/arrivee.yaml
- tapOn: "(.*[,.] )?(Profil)([,.] .*)?"
- runFlow: sous/fenetres.yaml
- extendedWaitUntil:
    visible: "(.*[,.] )?(Sauvegarder mon jardin)([,.] .*)?"
    timeout: 15000
- tapOn: "(.*[,.] )?(Avec un e-mail)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Sauvegarder votre jardin|Créer votre compte)([,.] .*)?"
    timeout: 15000
- takeScreenshot: inscription-1-formulaire
- tapOn: "(.*[,.] )?(Jeanne Dupont)([,.] .*)?"
- inputText: ${NOM}
- tapOn: "(.*[,.] )?(vous@exemple.fr)([,.] .*)?"
- inputText: ${EMAIL}
- tapOn: "(.*[,.] )?(6 caractères minimum)([,.] .*)?"
- inputText: ${MOT_DE_PASSE}
- hideKeyboard
- tapOn: "(.*[,.] )?(Créer mon compte)([,.] .*)?"
- extendedWaitUntil:
    notVisible: "(.*[,.] )?(Sauvegarder votre jardin|Créer votre compte)([,.] .*)?"
    timeout: 30000
- runFlow: sous/fenetres.yaml
- assertNotVisible: "(.*[,.] )?(Cet e-mail a déjà un compte.*)([,.] .*)?"
- assertNotVisible: "(.*[,.] )?(Inscription impossible.*)([,.] .*)?"
- tapOn:
    text: "(.*[,.] )?(Profil)([,.] .*)?"
    optional: true
- extendedWaitUntil:
    notVisible: "(.*[,.] )?(Sauvegarder mon jardin)([,.] .*)?"
    timeout: 15000
- takeScreenshot: inscription-2-compte-cree
