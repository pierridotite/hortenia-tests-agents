# Création du jardin à l'onboarding, puis l'accueil : nom, ville, outils.
appId: com.hortenia.app
name: 01 Création du jardin
---
- runFlow: sous/arrivee.yaml
- assertVisible: "(.*[,.] )?(Jardin)([,.] .*)?"
- assertVisible: "(.*[,.] )?(Communauté)([,.] .*)?"
- scrollUntilVisible:
    element:
      text: "(.*[,.] )?(Calculer)([,.] .*)?"
    direction: DOWN
    timeout: 15000
- assertVisible: "(.*[,.] )?(Planifier)([,.] .*)?"
- assertVisible: "(.*[,.] )?(Météo)([,.] .*)?"
- takeScreenshot: jardin-6-accueil
