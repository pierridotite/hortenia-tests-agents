# Réactions de la Communauté, sur le seul post du banc (créé par le workflow,
# invisible des vrais jardiniers) : appui long sur le cœur, « Ça pousse »,
# puis retrait. Rien d'autre n'est touché dans le fil.
appId: com.hortenia.app
name: 04 Réactions Communauté
env:
  TEXTE_POST: "Banc Maestro : post de test pour les réactions."
---
- runFlow: sous/arrivee.yaml
- tapOn: "(.*, )?(Communauté)(, .*)?"
- runFlow: sous/fenetres.yaml
- scrollUntilVisible:
    element:
      text: "(.*, )?(${TEXTE_POST})(, .*)?"
    direction: DOWN
    timeout: 60000
    centerElement: true
- takeScreenshot: reactions-1-post
- longPressOn:
    text: "(.*, )?(J.aime)(, .*)?"
    below: "(.*, )?(${TEXTE_POST})(, .*)?"
- extendedWaitUntil:
    visible: "(.*, )?(Ça pousse)(, .*)?"
    timeout: 10000
- assertVisible: "(.*, )?(Bravo)(, .*)?"
- assertVisible: "(.*, )?(Bon à savoir)(, .*)?"
- takeScreenshot: reactions-2-pastille
- tapOn: "(.*, )?(Ça pousse)(, .*)?"
- extendedWaitUntil:
    visible: "(.*, )?(Retirer ma réaction.: Ça pousse)(, .*)?"
    timeout: 10000
- takeScreenshot: reactions-3-ca-pousse
- tapOn: "(.*, )?(Retirer ma réaction.: Ça pousse)(, .*)?"
- extendedWaitUntil:
    notVisible: "(.*, )?(Retirer ma réaction.: Ça pousse)(, .*)?"
    timeout: 10000
- takeScreenshot: reactions-4-retiree
