# Onboarding complet d'un nouveau téléphone, jusqu'à l'accueil du jardin
# (compte invité) : objectif, Jardin, ville, tracé de 4 coins, plantes de
# saison, « Votre jardin est prêt », paywall fermé sans rien acheter.
appId: com.hortenia.app
env:
  VILLE: Draveil
  VILLE_DETAIL: Essonne, France
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: fenetres.yaml
- extendedWaitUntil:
    visible: "(.*[,.] )?(Créer mon jardin)([,.] .*)?"
    timeout: 60000
- runFlow: fenetres.yaml
- tapOn: "(.*[,.] )?(Créer mon jardin)([,.] .*)?"
# T43 lancé le 18/11 : sans version imposée, le téléphone tire A ou B au
# sort. B pose sa question seule (une touche fait avancer), A la sienne.
# Repère de B : une réponse, pas le titre (espaces insécables du titre).
- extendedWaitUntil:
    visible: "(.*[,.] )?(J.oublie des gestes|Penser à tout au bon moment)([,.] .*)?"
    timeout: 20000
- runFlow:
    when:
      visible: "(.*[,.] )?(Penser à tout au bon moment)([,.] .*)?"
    commands:
      - takeScreenshot: jardin-0-parcours-B
      - tapOn: "(.*[,.] )?(Penser à tout au bon moment)([,.] .*)?"
- runFlow:
    when:
      visible: "(.*[,.] )?(J.oublie des gestes)([,.] .*)?"
    commands:
      - takeScreenshot: jardin-0-parcours-A
      - tapOn: "(.*[,.] )?(J.oublie des gestes)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Jardin)([,.] .*)?"
    timeout: 15000
- tapOn: "(.*[,.] )?(Jardin)([,.] .*)?"
- scrollUntilVisible:
    element:
      text: "(.*[,.] )?(Continuer)([,.] .*)?"
    direction: DOWN
- tapOn: "(.*[,.] )?(Continuer)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Où est votre jardin.\\?)([,.] .*)?"
    timeout: 15000
- tapOn: "(.*[,.] )?(Ville, code postal ou adresse)([,.] .*)?"
- inputText: ${VILLE}
- extendedWaitUntil:
    visible: "(.*[,.] )?(${VILLE_DETAIL})([,.] .*)?"
    timeout: 15000
- tapOn: "(.*[,.] )?(${VILLE_DETAIL})([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Votre jardin est ici.\\?)([,.] .*)?"
    timeout: 20000
# Tracé : 4 coins au milieu de la carte, la surface doit rester celle d'un
# jardin (T1 de la 1.8.1 : la carte s'ouvrait à l'échelle de la ville)
- tapOn: "(.*[,.] )?(Tracer la zone, pour la surface)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Tracez votre zone)([,.] .*)?"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: jardin-1-trace-vide
- tapOn:
    point: "38%,38%"
- tapOn:
    point: "62%,38%"
- tapOn:
    point: "62%,55%"
- tapOn:
    point: "38%,55%"
- takeScreenshot: jardin-2-quatre-coins
- tapOn: "(.*[,.] )?(Valider la zone)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Zone tracée · \\d{1,4} m²)([,.] .*)?"
    timeout: 15000
- takeScreenshot: jardin-3-zone-tracee
- tapOn: "(.*[,.] )?(Placer mon jardin ici)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Qu.est-ce qu.on y cultive.\\?)([,.] .*)?"
    timeout: 20000
- extendedWaitUntil:
    visible: "(.*[,.] )?(Ajouter (ces \\d+ plantes|cette plante) de saison)([,.] .*)?"
    timeout: 20000
- tapOn: "(.*[,.] )?(Ajouter (ces \\d+ plantes|cette plante) de saison)([,.] .*)?"
# Toucher parfois perdu sur iPhone (18/11, B) : le bouton reste, on retouche
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "(.*[,.] )?(Ajouter (ces \\d+ plantes|cette plante) de saison)([,.] .*)?"
    commands:
      - tapOn: "(.*[,.] )?(Ajouter (ces \\d+ plantes|cette plante) de saison)([,.] .*)?"
      - waitForAnimationToEnd:
          timeout: 5000
# B : les plantes ajoutées, « Voir ma saison », la préparation, puis « Votre saison à … »
- runFlow:
    when:
      visible: "(.*[,.] )?(Voir ma saison)([,.] .*)?"
    commands:
      - tapOn: "(.*[,.] )?(Voir ma saison)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Votre jardin est prêt|Votre saison.*)([,.] .*)?"
    timeout: 40000
- takeScreenshot: jardin-4-pret
- scrollUntilVisible:
    element:
      text: "(.*[,.] )?(Continuer)([,.] .*)?"
    direction: DOWN
    timeout: 15000
- tapOn: "(.*[,.] )?(Continuer)([,.] .*)?"
# Version B de T1 : demande de notifications ; version B de T4 : « Essayez tout de suite »
- runFlow: fenetres.yaml
- runFlow:
    when:
      visible: "(.*[,.] )?(Essayez tout de suite)([,.] .*)?"
    commands:
      - tapOn: "(.*[,.] )?(Passer)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Fermer)([,.] .*)?"
    timeout: 30000
- takeScreenshot: jardin-5-paywall-onboarding
- tapOn: "(.*[,.] )?(Fermer)([,.] .*)?"
- runFlow:
    when:
      visible: "(.*[,.] )?(Continuer avec la version gratuite|Non merci|Plus tard)([,.] .*)?"
    commands:
      - tapOn: "(.*[,.] )?(Continuer avec la version gratuite|Non merci|Plus tard)([,.] .*)?"
- extendedWaitUntil:
    visible: "(.*[,.] )?(Profil)([,.] .*)?"
    timeout: 45000
- runFlow: fenetres.yaml
