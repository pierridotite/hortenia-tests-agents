name: Vérifier les réactions (serveur)
on:
  workflow_dispatch:
    inputs:
      garder:
        description: "Laisser le post de test dans le banc pour les testeurs"
        type: boolean
        default: false
      post_id:
        description: "Post du banc existant (vide : en créer un)"
        type: string
        default: ""
      etendu:
        description: "Ajouter réponse à un commentaire et refus HORS_BANC"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python3 outils/verif_reactions.py
        env:
          TESTS_JETON: ${{ secrets.TESTS_JETON }}
          GARDER: ${{ inputs.garder && '1' || '0' }}
          POST_ID: ${{ inputs.post_id }}
          ETENDU: ${{ inputs.etendu && '1' || '0' }}
