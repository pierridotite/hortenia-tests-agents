# Agents IA sur un émulateur Android : récupère le dernier build Hortenia chez
# Expo, le lance sur un téléphone virtuel et fait jouer les personas de
# personas.json. Les résultats (captures, journal, rapport) sortent chiffrés.
name: Android - agents

on:
  workflow_dispatch:
    inputs:
      personas:
        description: Personas à jouer, ids séparés par des virgules (vide = toutes)
        required: false
        default: ""
      pas_max:
        description: Nombre maximal de gestes par persona
        required: false
        default: "30"
      build_id:
        description: Build Expo précis (vide = dernier build Android terminé)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-agents
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Dernier build Android chez Expo
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python outils/telecharger_build.py android app.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK pour l'émulateur
        run: bash outils/apk_universel.sh app.bin app.apk "${{ steps.build.outputs.extension }}"

      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et agents
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERSONAS: ${{ inputs.personas }}
          PAS_MAX: ${{ inputs.pas_max }}
          RUN_ID: ${{ github.run_id }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash outils/lancer_agents.sh

      - name: Chiffrer les résultats
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-chiffres
          path: resultats.chiffres/
          retention-days: 14

      - name: Résumé
        if: always()
        run: |
          echo "Build testé : ${{ steps.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          [ -f resultats/bilans.json ] && python -c "import json;[print(f\"- {b['id']} : {b['pas']} gestes, {b['fin']}\") for b in json.load(open('resultats/bilans.json'))]" >> "$GITHUB_STEP_SUMMARY" || true
