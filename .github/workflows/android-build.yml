# Build Android de l'app Hortenia sur les machines Linux gratuites de ce
# dépôt public (sans build Expo ni minute du dépôt privé), voulu par Pierre
# le 29/10. Même principe que ios-build.yml : code lu avec APP_REPO_TOKEN
# (lecture seule) et jamais affiché, clé de signature gardée par Expo
# (EXPO_TOKEN), journaux chiffrés. Sans « envoyer », l'aab est déposé chez
# Expo (eas upload) pour android-claude.yml. Avec « envoyer », c'est le build
# store : secret TikTok ajouté, envoi en test interne Google Play (secret
# PLAY_SERVICE_ACCOUNT_JSON), et pas de dépôt chez Expo, pour que les
# testeurs ne le reprennent jamais.
name: Android - build

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: Envoyer l'aab en test interne Google Play
        required: false
        type: boolean
        default: false
      tiktok_debug:
        description: "Build de vérification TikTok : secret + mode debug du SDK, sans envoi (jamais pour les testeurs IA)"
        required: false
        type: boolean
        default: false
      banc:
        description: "Build des testeurs 1.7 et suivantes : mode banc (marque HMAC du secret TESTS_JETON), jamais avec envoyer"
        required: false
        type: boolean
        default: false
      ref:
        description: Branche ou commit de l'app à construire (dépôt Hortenia, sha complet)
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Code de l'app (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: pierridotite/Hortenia
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          persist-credentials: false
          sparse-checkout: Frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: EAS CLI
        run: npm install -g --silent eas-cli@27.1.0  # version figée : le greffon de build local sort parfois après la CLI

      # Secret de l'app TikTok (signature des envois du SDK), pour le build
      # store seulement : les builds de test des testeurs IA restent sans
      # secret (SDK inactif, aucune fausse installation chez TikTok). Même
      # ligne que l'étape « Identifiants TikTok » de app-build.yml (dépôt privé).
      - name: Identifiants TikTok (build store ou vérification)
        if: ${{ inputs.envoyer || inputs.tiktok_debug }}
        working-directory: app/Frontend
        env:
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          ENVOYER: ${{ inputs.envoyer }}
          DEBUG: ${{ inputs.tiktok_debug }}
        run: |
          # Le mode debug ne part jamais sur Google Play
          if [ "$DEBUG" = true ] && [ "$ENVOYER" = true ]; then echo "tiktok_debug et envoyer ne vont pas ensemble"; exit 1; fi
          if [ -z "$TIKTOK_APP_SECRET" ]; then
            echo "TIKTOK_APP_SECRET absent : SDK TikTok inactif dans ce build"
            [ "$DEBUG" = true ] && exit 1
            exit 0
          fi
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.extra.tiktok.secret=process.env.TIKTOK_APP_SECRET;if(process.env.DEBUG==='true')a.expo.extra.tiktok.debug=true;fs.writeFileSync('app.json',JSON.stringify(a,null,2)+'\\n')"
          echo "Secret TikTok ajouté à app.json pour ce build"
          if [ "$DEBUG" = true ]; then
            echo "Mode debug TikTok activé"
            echo "Build de vérification TikTok (secret + debug) : à ne JAMAIS passer aux testeurs IA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Marque du banc (build des testeurs seulement)
        if: ${{ inputs.banc }}
        env:
          TESTS_JETON: ${{ secrets.TESTS_JETON }}
          ENVOYER: ${{ inputs.envoyer }}
        run: |
          if [ "$ENVOYER" = true ]; then echo "banc et envoyer ne vont pas ensemble : jamais de marque du banc dans un build des stores"; exit 1; fi
          if [ -z "$TESTS_JETON" ]; then echo "secret TESTS_JETON absent"; exit 1; fi
          C=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://admin.hortenia.com/tests/banc/liste -H 'Content-Type: application/json' -H "Authorization: Bearer $TESTS_JETON" -d '{}')
          echo "serveur du banc : HTTP $C"
          if [ "$C" = 401 ] || [ "$C" = 403 ]; then echo "le jeton TESTS_JETON de ce dépôt n'est pas celui du serveur : demander à Pierre de le recopier"; exit 1; fi
          M=$(python3 -c "import hmac,hashlib,os;print(hmac.new(os.environ['TESTS_JETON'].encode(),b'hortenia-banc',hashlib.sha256).hexdigest())")
          echo "::add-mask::$M"
          echo "EXPO_PUBLIC_BANC_MARQUE=$M" >> "$GITHUB_ENV"
          echo "Build du banc (mode banc actif) : à ne JAMAIS envoyer dans les stores" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ENVOYER: ${{ inputs.envoyer }}
        run: bash outils/build_android.sh "$GITHUB_WORKSPACE/app/Frontend"

      - name: Chiffrer les journaux
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-chiffres-android
          path: resultats.chiffres/
          retention-days: 14

      - name: Nettoyage
        if: always()
        run: rm -rf app "$RUNNER_TEMP/sortie" resultats
