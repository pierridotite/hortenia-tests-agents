# Build iOS de l'app Hortenia sur les Mac gratuits de ce dépôt public
# (dépôt privé : une minute Mac en compte 10), voulu par Pierre le 29/10.
#
# Le code de l'app est privé : ce dépôt le lit avec le secret APP_REPO_TOKEN
# (jeton GitHub de Pierre en lecture seule sur pierridotite/Hortenia) et ne
# l'affiche jamais. Les journaux de build (npm, Xcode) partent chiffrés avec
# la clé du dépôt, comme les résultats des tests ; le journal public ne
# montre que les étapes. Seuls Pierre et Claude peuvent lancer ce workflow.
#
# Cibles :
# - simulateur : app pour le simulateur iOS (testeurs IA), déposée chez Expo
#   par « eas upload » ; ios-claude.yml la récupère par son id.
# - store : ipa signée avec les certificats gardés par Expo (EXPO_TOKEN),
#   envoyée dans TestFlight si « envoyer » est coché (secret ASC_API_KEY_P8).
name: iOS - build

on:
  workflow_dispatch:
    inputs:
      cibles:
        description: Builds à faire, séparés par des virgules (simulateur, store)
        required: false
        default: "simulateur,store"
      envoyer:
        description: Envoyer l'ipa store dans TestFlight
        required: false
        type: boolean
        default: false
      ref:
        description: Branche ou commit de l'app à construire (dépôt Hortenia)
        required: false
        default: main

permissions:
  contents: read

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      cibles: ${{ steps.l.outputs.cibles }}
    steps:
      - id: l
        env:
          CIBLES: ${{ inputs.cibles }}
        run: |
          python3 -c "import json,os;print('cibles='+json.dumps([c.strip() for c in os.environ['CIBLES'].split(',') if c.strip() in ('simulateur','store')]))" >> "$GITHUB_OUTPUT"

  build:
    needs: liste
    runs-on: macos-15
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        cible: ${{ fromJSON(needs.liste.outputs.cibles) }}
    env:
      CIBLE: ${{ matrix.cible }}
    steps:
      - uses: actions/checkout@v4

      - name: Code de l'app (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: pierridotite/Hortenia
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          persist-credentials: false
          sparse-checkout: Frontend

      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: EAS CLI
        run: npm install -g --silent eas-cli

      - name: Build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ENVOYER: ${{ inputs.envoyer }}
        run: bash outils/build_ios.sh "$GITHUB_WORKSPACE/app/Frontend"

      - name: Chiffrer les journaux
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-chiffres-${{ matrix.cible }}
          path: resultats.chiffres/
          retention-days: 14

      - name: Nettoyage
        if: always()
        run: rm -rf app "$RUNNER_TEMP/sortie" resultats
