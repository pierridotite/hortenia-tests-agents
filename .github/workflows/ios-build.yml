# Build iOS de l'app Hortenia sur les Mac gratuits de ce dépôt public
# (dépôt privé : une minute Mac en compte 10), voulu par Pierre le 29/10.
#
# Le code de l'app est privé : il n'est jamais lisible ici. Chaque Mac crée
# une clé éphémère et publie sa clé publique (artefact cle-<cible>). Une
# session Claude qui a accès au dépôt privé lance outils/envoyer_source.sh :
# le code part chiffré sur la branche transfert/<run>, seul ce Mac peut le
# lire, et la branche est supprimée en fin de run. Les journaux de build
# (npm, Xcode) partent chiffrés avec la clé du dépôt, comme les résultats
# des tests ; le journal public ne montre que les étapes.
#
# Cibles :
# - simulateur : app pour le simulateur iOS (testeurs IA), déposée chez Expo
#   par « eas upload » ; ios-claude.yml la récupère par son id.
# - store : ipa signée avec les certificats gardés par Expo (EXPO_TOKEN),
#   envoyée dans TestFlight si « envoyer » est coché (secret ASC_API_KEY_P8).
name: iOS - build

on:
  workflow_dispatch:
    inputs:
      cibles:
        description: Builds à faire, séparés par des virgules (simulateur, store)
        required: false
        default: "simulateur,store"
      envoyer:
        description: Envoyer l'ipa store dans TestFlight
        required: false
        type: boolean
        default: false
      version:
        description: Version construite (pour le résumé, ex. 1.6.3)
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      cibles: ${{ steps.l.outputs.cibles }}
    steps:
      - id: l
        env:
          CIBLES: ${{ inputs.cibles }}
        run: |
          python3 -c "import json,os;print('cibles='+json.dumps([c.strip() for c in os.environ['CIBLES'].split(',') if c.strip() in ('simulateur','store')]))" >> "$GITHUB_OUTPUT"

  build:
    needs: liste
    runs-on: macos-15
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        cible: ${{ fromJSON(needs.liste.outputs.cibles) }}
    env:
      CIBLE: ${{ matrix.cible }}
    steps:
      - uses: actions/checkout@v4

      - name: Clé éphémère du Mac
        run: |
          mkdir -p cle-ephemere
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/ephemere.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/ephemere.pem" -pubout -out "cle-ephemere/cle-$CIBLE.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: cle-${{ matrix.cible }}
          path: cle-ephemere/
          retention-days: 1

      - name: Attendre le code chiffré (outils/envoyer_source.sh)
        run: bash outils/recevoir_source.sh "$RUNNER_TEMP/app"

      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: EAS CLI
        run: npm install -g --silent eas-cli

      - name: Build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ENVOYER: ${{ inputs.envoyer }}
        run: bash outils/build_ios.sh "$RUNNER_TEMP/app/Frontend"

      - name: Chiffrer les journaux
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-chiffres-${{ matrix.cible }}
          path: resultats.chiffres/
          retention-days: 14

      - name: Nettoyage
        if: always()
        run: rm -rf "$RUNNER_TEMP/app" "$RUNNER_TEMP/ephemere.pem" "$RUNNER_TEMP/sortie" resultats

  nettoyage:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer la branche de transfert
        run: git push origin --delete "transfert/${{ github.run_id }}" 2>/dev/null || echo "pas de branche à supprimer"
