# Même test que android.yml, mais le testeur est Claude Code, avec
# l'abonnement Claude de Pierre (secret CLAUDE_CODE_OAUTH_TOKEN, pas d'API
# payante). Consignes : CONSIGNES_CLAUDE.md. Sortie chiffrée, rien d'écrit
# dans le journal public du lancement.
name: Android - Claude

on:
  workflow_dispatch:
    inputs:
      personas:
        description: Personas à jouer, une par émulateur en parallèle (ids séparés par des virgules)
        required: false
        default: "sophie,yves,ines,francois,amandine,gerard,julie,hugo,martine,tom"
      modele:
        description: Modèle Claude
        required: false
        default: claude-sonnet-5-5
      build_id:
        description: Build Expo précis (vide = dernier build Android terminé)
        required: false
        default: ""
      consignes:
        description: Fichier de consignes (enquête ciblée ; vide = test complet CONSIGNES_CLAUDE.md)
        required: false
        default: ""

permissions:
  contents: read


jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      personas: ${{ steps.l.outputs.personas }}
    steps:
      - uses: actions/checkout@v4
      # Une ligne par persona, avec son téléphone (personas.json, « appareil »)
      - id: l
        env:
          PERSONAS: ${{ inputs.personas }}
        run: python3 outils/matrice.py >> "$GITHUB_OUTPUT"

  claude:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.liste.outputs.personas) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Dernier build Android chez Expo
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python outils/telecharger_build.py android app.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK pour l'émulateur
        run: bash outils/apk_universel.sh app.bin app.apk "${{ steps.build.outputs.extension }}"

      - name: Claude Code
        run: npm install -g --silent @anthropic-ai/claude-code

      # Les téléphones virtuels ne doivent rien envoyer à PostHog : un DNS
      # local répond 0.0.0.0 pour posthog.com, les adresses réelles de
      # PostHog sont refusées par le pare-feu de la machine (le trafic de
      # l'émulateur passe par elle), et lancer_claude.sh vérifie le blocage
      # depuis l'émulateur avant de commencer.
      - name: Couper PostHog
        run: |
          sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null
          printf 'listen-address=127.0.0.1\nbind-interfaces\nno-resolv\nserver=8.8.8.8\nserver=1.1.1.1\naddress=/posthog.com/0.0.0.0\naddress=/posthog.com/::\naddress=/facebook.com/0.0.0.0\naddress=/facebook.net/0.0.0.0\n' | sudo tee /etc/dnsmasq.d/hortenia.conf
          sudo systemctl restart dnsmasq
          test "$(dig +short eu.i.posthog.com @127.0.0.1)" = "0.0.0.0"
          dig +short expo.dev @127.0.0.1 | head -1
          for h in eu.i.posthog.com eu-assets.i.posthog.com eu.posthog.com; do
            for ip in $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$'); do sudo iptables -I OUTPUT -d "$ip" -j REJECT; echo "refusé : $ip"; done
            for ip in $(dig +short AAAA "$h" @8.8.8.8 | grep ':'); do sudo ip6tables -I OUTPUT -d "$ip" -j REJECT; done
          done

      # Profil d'appareil absent de l'outil Android : Pixel 6, signalé au résumé
      - name: Profil du téléphone
        id: profil
        env:
          PROFIL: ${{ matrix.profil }}
        run: |
          if "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c 2>/dev/null | grep -qx "$PROFIL"; then
            echo "profil=$PROFIL" >> "$GITHUB_OUTPUT"
          else
            echo "profil=pixel_6" >> "$GITHUB_OUTPUT"
            echo "Profil $PROFIL absent : Pixel 6 à la place" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et Claude
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PERSONAS: ${{ matrix.persona }}
          MODELE: ${{ inputs.modele }}
          RUN_ID: ${{ github.run_id }}
          APPAREIL: ${{ matrix.appareil }}
          TAILLE_TEXTE: ${{ matrix.taille_texte }}
          THEME: ${{ matrix.theme }}
          POSITION: ${{ matrix.position }}
          LOCALISATION: ${{ matrix.localisation }}
          CONSIGNES: ${{ inputs.consignes }}
          LOGCAT_COMPLET: ${{ inputs.consignes != '' && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profil.outputs.profil }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 127.0.0.1
          script: bash outils/lancer_claude.sh

      - name: Chiffrer les résultats
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-chiffres-${{ matrix.persona }}
          path: resultats.chiffres/
          retention-days: 14

      - name: Résumé
        if: always()
        run: |
          echo "Build testé : ${{ steps.build.outputs.version }} (persona ${{ matrix.persona }}, ${{ matrix.appareil }})" >> "$GITHUB_STEP_SUMMARY"
