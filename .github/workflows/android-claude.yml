# Même test que android.yml, mais le testeur est Claude Code, avec
# l'abonnement Claude de Pierre (secret CLAUDE_CODE_OAUTH_TOKEN, pas d'API
# payante). Consignes : CONSIGNES_CLAUDE.md. Sortie chiffrée, rien d'écrit
# dans le journal public du lancement.
name: Android - Claude

on:
  workflow_dispatch:
    inputs:
      personas:
        description: Personas à jouer, ids séparés par des virgules (vide = toutes)
        required: false
        default: ""
      modele:
        description: Modèle Claude
        required: false
        default: claude-sonnet-5-5
      build_id:
        description: Build Expo précis (vide = dernier build Android terminé)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-claude
  cancel-in-progress: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Dernier build Android chez Expo
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python outils/telecharger_build.py android app.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK pour l'émulateur
        run: bash outils/apk_universel.sh app.bin app.apk "${{ steps.build.outputs.extension }}"

      - name: Claude Code
        run: npm install -g --silent @anthropic-ai/claude-code

      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et Claude
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PERSONAS: ${{ inputs.personas }}
          MODELE: ${{ inputs.modele }}
          RUN_ID: ${{ github.run_id }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash outils/lancer_claude.sh

      - name: Chiffrer les résultats
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-chiffres
          path: resultats.chiffres/
          retention-days: 14

      - name: Résumé
        if: always()
        run: echo "Build testé : ${{ steps.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
