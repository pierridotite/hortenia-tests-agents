# Même test que android.yml, mais le testeur est Claude Code, avec
# l'abonnement Claude de Pierre (secret CLAUDE_CODE_OAUTH_TOKEN, pas d'API
# payante). Consignes : CONSIGNES_CLAUDE.md. Sortie chiffrée, rien d'écrit
# dans le journal public du lancement.
name: Android - Claude

on:
  workflow_dispatch:
    inputs:
      personas:
        description: Personas à jouer, une par émulateur en parallèle (ids séparés par des virgules)
        required: false
        default: "camille,monique,karim,thomas,elodie,bernard,lea,marc,nadia,jeanpierre"
      modele:
        description: Modèle Claude
        required: false
        default: claude-sonnet-5-5
      build_id:
        description: Build Expo précis (vide = dernier build Android terminé)
        required: false
        default: ""

permissions:
  contents: read


jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      personas: ${{ steps.l.outputs.personas }}
    steps:
      - id: l
        env:
          PERSONAS: ${{ inputs.personas }}
        run: echo "personas=$(python3 -c "import json,os;print(json.dumps([p.strip() for p in os.environ['PERSONAS'].split(',') if p.strip()]))")" >> "$GITHUB_OUTPUT"

  claude:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        persona: ${{ fromJSON(needs.liste.outputs.personas) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Dernier build Android chez Expo
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python outils/telecharger_build.py android app.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK pour l'émulateur
        run: bash outils/apk_universel.sh app.bin app.apk "${{ steps.build.outputs.extension }}"

      - name: Claude Code
        run: npm install -g --silent @anthropic-ai/claude-code

      # Les téléphones virtuels ne doivent rien envoyer à PostHog : un DNS
      # local répond 0.0.0.0 pour posthog.com, et lancer_claude.sh vérifie
      # le blocage depuis l'émulateur avant de commencer.
      - name: Couper PostHog
        run: |
          sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null
          printf 'listen-address=127.0.0.1\nbind-interfaces\nno-resolv\nserver=8.8.8.8\nserver=1.1.1.1\naddress=/posthog.com/0.0.0.0\naddress=/posthog.com/::\n' | sudo tee /etc/dnsmasq.d/hortenia.conf
          sudo systemctl restart dnsmasq
          test "$(dig +short eu.i.posthog.com @127.0.0.1)" = "0.0.0.0"
          dig +short expo.dev @127.0.0.1 | head -1

      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et Claude
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PERSONAS: ${{ matrix.persona }}
          MODELE: ${{ inputs.modele }}
          RUN_ID: ${{ github.run_id }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 127.0.0.1
          script: bash outils/lancer_claude.sh

      - name: Chiffrer les résultats
        if: always()
        run: bash outils/chiffrer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-chiffres-${{ matrix.persona }}
          path: resultats.chiffres/
          retention-days: 14

      - name: Résumé
        if: always()
        run: |
          echo "Build testé : ${{ steps.build.outputs.version }} (persona ${{ matrix.persona }})" >> "$GITHUB_STEP_SUMMARY"
